name: Random Cron
on:
  schedule:
    - cron: '17 11 * * *' # 19:17 UTC+8
  workflow_dispatch:

concurrency: mimotion-state

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.PAT }}
      - name: Plan tomorrow's submission
        run: |
          bash cron_convert.sh
          git add .github/workflows/run.yml cron_change_time
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Schedule tomorrow's step submission"
          git push origin master
