name: 刷步数

on:
  schedule:
    - cron: '7,22,37,52 8-17 * * *'
      timezone: Asia/Singapore
    - cron: '0 18 * * *'
      timezone: Asia/Singapore
  workflow_dispatch:

concurrency:
  group: mimotion-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.PAT }}
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Check daily schedule
        id: gate
        run: python3 daily_schedule.py
      - name: 开始
        if: steps.gate.outputs.should_submit == 'true'
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          MIN_STEP: ${{ vars.MIN_STEP }}
          MAX_STEP: ${{ vars.MAX_STEP }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py
      - name: Record successful submission
        if: success() && steps.gate.outputs.should_submit == 'true'
        run: python3 daily_schedule.py --complete "${{ steps.gate.outputs.date }}"
      - name: Persist submission state
        if: always() && steps.gate.outcome == 'success'
        run: |
          git add encrypted_tokens.data cron_change_time
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Persist daily step submission state"
          git push origin master
