name: 刷步数

on:
  schedule:
    - cron: '28 3 12 11 *'
  workflow_dispatch:

concurrency: mimotion-state

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            scheduled_date=$(sed -n 's/^scheduled date: //p' cron_change_time)
            local_date=$(TZ=Asia/Singapore date +%F)
            local_time=$(TZ=Asia/Singapore date +%H:%M)
            if [[ "$local_date" != "$scheduled_date" || "$local_time" < "08:00" || "$local_time" > "18:00" ]]; then
              echo "Skipping delayed run outside its scheduled date or the 08:00–18:00 window."
              exit 0
            fi
          fi
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add encrypted_tokens.data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
