name: 每日随机步数

on:
  schedule:
    # UTC, hourly fallback attempts. Python enforces the UTC+8 daytime window.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查调度，不等待、不提交步数'
        type: boolean
        default: false

concurrency:
  group: mimotion-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.PAT }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Test daily scheduling
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait randomly and submit once
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          MIN_STEP: ${{ vars.MIN_STEP }}
          MAX_STEP: ${{ vars.MAX_STEP }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -u daily_submit.py --dry-run
          else
            python -u daily_submit.py
          fi
      - name: Save successful date and encrypted login cache
        if: always() && inputs.dry_run != true
        run: |
          git add encrypted_tokens.data
          if [ -f daily_submission.json ]; then
            git add daily_submission.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Save daily submission result"
          git push origin HEAD:master
